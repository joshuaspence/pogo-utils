<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Pokémon GO Utilities</title>

  <!-- A Poké Ball in the site's own accent red, the one src/theme.css carries, drawn at 32px so the band and the
       button still read once a browser paints it at 16. The rim is the only part that sits against the tab bar, so
       it is the only part that follows the tab bar's theme; the band and the button always sit against the ball's own
       red and white, so they stay dark in both. A browser that ignores the media query keeps the light rim, which is
       the same icon with a darker outline rather than a broken one. -->
  <style>
    .rim {
      stroke: #1c1f26;
    }

    @media (prefers-color-scheme: dark) {
      .rim {
        stroke: #e7e9ee;
      }
    }
  </style>

  <defs>
    <clipPath id="ball">
      <circle cx="16" cy="16" r="15" />
    </clipPath>
  </defs>

  <g clip-path="url(#ball)">
    <rect width="32" height="32" fill="#fff" />
    <rect width="32" height="16" fill="#e3350d" />
    <rect y="13" width="32" height="6" fill="#1c1f26" />
  </g>

  <circle class="rim" cx="16" cy="16" r="15" fill="none" stroke-width="2" />
  <circle cx="16" cy="16" r="4.5" fill="#fff" stroke="#1c1f26" stroke-width="2" />
</svg>
