<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon GO Utilities</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <!-- The site opens on the events calendar; the map now lives at routes.html. Redirect the bare Pages URL and any
         old bookmark of the root there. location.replace leaves no history entry, so Back does not bounce here; the
         meta refresh is the no-JavaScript fallback and the link is the last resort if both are blocked. -->
    <link rel="canonical" href="events.html" />
    <meta http-equiv="refresh" content="0; url=events.html" />
    <script>
      location.replace('events.html');
    </script>
  </head>
  <body>
    <p>Redirecting to the <a href="events.html">events calendar</a>…</p>
  </body>
</html>
