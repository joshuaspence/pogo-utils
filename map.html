<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon GO Utilities</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1d25" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="src/theme.css" />
    <link rel="stylesheet" href="src/app.css" />
    <link rel="stylesheet" href="src/nav.css" />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <nav class="topnav">
      <a class="tab" href="events.html"><span class="ico" aria-hidden="true">📅</span> Events</a>
      <a class="tab" href="map.html" aria-current="page"><span class="ico" aria-hidden="true">🗺️</span> Map</a>
      <a class="tab" href="search.html"><span class="ico" aria-hidden="true">🔎</span> Search</a>
      <a class="tab" href="pokedex.html"><span class="ico" aria-hidden="true">📖</span> Pokédex</a>
      <a class="tab" href="pgsharp.html"><span class="ico" aria-hidden="true">💾</span> PGSharp</a>
    </nav>
    <div class="app">
      <aside id="sidebar">
        <header>
          <h1>Pokémon GO Routes</h1>
          <div class="sub" id="count">Loading routes…</div>
        </header>
        <div class="search">
          <input id="filter" type="search" placeholder="Filter tracks & waypoints…" autocomplete="off" />
        </div>
        <div id="list"></div>
        <footer>
          Map data ©
          <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>
          contributors. Click a track or waypoint to zoom.
        </footer>
      </aside>

      <div class="map-wrap">
        <div id="banner"></div>
        <div id="toast"></div>
        <div id="map"></div>
      </div>
    </div>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
