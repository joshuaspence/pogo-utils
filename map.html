<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon GO Utilities</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin
    />
    <link rel="stylesheet" href="src/nav.css" />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <nav class="topnav">
      <a class="tab" href="events.html"><span class="ico" aria-hidden="true">📅</span> Events</a>
      <a class="tab" href="map.html" aria-current="page"><span class="ico" aria-hidden="true">🗺️</span> Map</a>
      <a class="tab" href="search.html"><span class="ico" aria-hidden="true">🔎</span> Search</a>
      <a class="tab" href="pgsharp.html"><span class="ico" aria-hidden="true">💾</span> PGSharp</a>
    </nav>
    <div class="app">
      <aside id="sidebar">
        <header>
          <h1>Pokémon GO Routes</h1>
          <div class="sub" id="count">Loading routes…</div>
        </header>
        <div class="search">
          <input id="filter" type="search" placeholder="Filter tracks & waypoints…" autocomplete="off" />
        </div>
        <div id="list"></div>
        <footer>
          Map data ©
          <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>
          contributors. Click a track or waypoint to zoom.
        </footer>
      </aside>

      <div class="map-wrap">
        <div id="banner"></div>
        <div id="toast"></div>
        <div id="map"></div>
      </div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin
    ></script>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
