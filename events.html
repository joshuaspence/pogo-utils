<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon GO Events</title>
    <link rel="stylesheet" href="src/theme.css" />
    <link rel="stylesheet" href="src/nav.css" />
    <link rel="stylesheet" href="src/events.css" />
  </head>
  <body>
    <nav class="topnav">
      <a class="tab" href="events.html" aria-current="page"><span class="ico" aria-hidden="true">📅</span> Events</a>
      <a class="tab" href="index.html"><span class="ico" aria-hidden="true">🗺️</span> Routes</a>
      <a class="tab" href="pgsharp.html"><span class="ico" aria-hidden="true">💾</span> PGSharp</a>
    </nav>
    <header class="page">
      <h1>Pokémon GO Events</h1>
      <p class="sub" id="count">Loading events…</p>
    </header>

    <section class="controls">
      <div class="viewtoggle" role="group" aria-label="View">
        <button id="viewCards" type="button" class="active" aria-pressed="true">Cards</button>
        <button id="viewCalendar" type="button" aria-pressed="false">Calendar</button>
      </div>
      <input id="search" type="search" placeholder="Search events…" autocomplete="off" />
      <label class="toggle"><input type="checkbox" id="showPast" /> Show ended</label>
      <button id="refresh" type="button">Refresh</button>
      <button id="reset" type="button" class="ghost" title="Show every type again and restore dismissed events">
        Reset
      </button>
    </section>

    <section class="type-filters" id="typeFilters" aria-label="Filter by event type"></section>

    <main id="events" aria-live="polite"></main>

    <footer>
      <p>
        Event data from
        <a href="https://leekduck.com/events/" target="_blank" rel="noopener">Leek Duck</a>
        via
        <a href="https://github.com/bigfoott/ScrapedDuck" target="_blank" rel="noopener">ScrapedDuck</a>, fetched live
        in your browser. Times are shown in your device's local timezone.
      </p>
      <p>This site is unofficial. Click an event to open its Leek Duck page.</p>
    </footer>

    <script type="module" src="src/events.js"></script>
  </body>
</html>
