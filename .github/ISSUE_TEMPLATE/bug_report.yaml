---
name: 'Bug report'
description: 'Something invoice-tool did that it should not have'
labels:
  - 'bug'

body:
  - type: 'input'
    id: 'version'
    attributes:
      label: 'Version'
      description: 'The commit you ran -- `git rev-parse --short HEAD` -- or a release, if you are on one.'
      placeholder: '1a2b3c4'
    validations:
      required: true

  - type: 'input'
    id: 'command'
    attributes:
      label: 'Command'
      description: 'The invocation, exactly as you ran it.'
      placeholder: 'invoice-tool download --merchant woolworths --scope 3m'
    validations:
      required: true

  - type: 'input'
    id: 'merchant'
    attributes:
      label: 'Merchant'
      description: 'The recipe this is about. Leave it empty if the bug is in the engine rather than in one merchant.'
      placeholder: 'woolworths'

  - type: 'textarea'
    id: 'expected'
    attributes:
      label: 'What should have happened'
    validations:
      required: true

  - type: 'textarea'
    id: 'actual'
    attributes:
      label: 'What happened instead'
    validations:
      required: true

  - type: 'textarea'
    id: 'output'
    attributes:
      label: 'Output'
      description: 'What the run printed. `--debug` adds the stack trace.'
      render: 'shell'

  - type: 'checkboxes'
    id: 'sanitised'
    attributes:
      label: 'Before posting'
      description: 'This repository is public.'
      options:
        - label: 'The output above carries no cookies, tokens or session data.'
          required: true
