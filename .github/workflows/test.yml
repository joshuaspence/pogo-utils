---
name: 'Test'

on:
  pull_request: {}
  push:
    branches: ['master']

permissions:
  contents: 'read'

jobs:
  unit-test:
    name: 'Unit Test'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    steps:
      - uses: 'actions/checkout@v7'
        with:
          lfs: true

      - name: 'Install dependencies'
        run: 'sudo apt-get update && sudo apt-get install --no-install-recommends --yes tesseract-ocr tesseract-ocr-eng'

      - uses: 'pnpm/setup@v3'
        with:
          cache: true
      - run: 'pnpm test'
