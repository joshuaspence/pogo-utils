---
name: 'Test'

on:
  pull_request: {}
  push:
    branches: ['master']

permissions:
  contents: 'read'

jobs:
  test:
    name: 'test'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v7'
      - uses: 'pnpm/setup@v2'
        with:
          cache: true
      - run: 'pnpm test'
