---
name: 'Vend'

on:
  push:
    branches: ['master']
    paths:
      - '.github/workflows/vend.yml'
      - 'scripts/vend-feed.mts'
      - 'src/event-feed.ts'

  schedule:
    - cron: '40 * * * *'

  workflow_dispatch: {}

permissions:
  actions: 'write'
  contents: 'write'

# Shared with `prune.yml`: both push to `master` without pulling first, so the second of two at once is rejected.
concurrency:
  group: 'master'
  cancel-in-progress: false

jobs:
  events:
    name: 'Events'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v7'
      - uses: 'pnpm/setup@v3'
        with:
          cache: true
      - run: 'pnpm vend:events'

      - name: 'Commit'
        id: 'commit'
        uses: 'stefanzweifel/git-auto-commit-action@v7'
        with:
          commit_author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          commit_message: 'Update the Leek Duck feed'
          file_pattern: 'data/events-feed.json'

      # GitHub raises no `push` event for a commit made with the default `GITHUB_TOKEN`, so `pages.yml` never fires and
      # and the site would stay at whatever a human push last built.
      - name: 'Deploy'
        if: "steps.commit.outputs.changes_detected == 'true'"
        run: 'gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"'
        env:
          GH_TOKEN: '${{ github.token }}'
