---
name: 'Pages'

on:
  push:
    branches: ['master']
  workflow_dispatch: {}

permissions:
  contents: 'read'

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: 'Build'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v7'
      - uses: 'actions/upload-pages-artifact@v5'
        with:
          path: '.'

  deploy:
    name: 'Deploy'
    needs: 'build'
    runs-on: 'ubuntu-latest'

    permissions:
      id-token: 'write'
      pages: 'write'

    environment:
      name: 'github-pages'
      url: '${{ steps.deploy.outputs.page_url }}'

    steps:
      - uses: 'actions/deploy-pages@v5'
