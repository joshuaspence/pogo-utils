---
name: 'Pages'

on:
  push:
    branches: ['master']

  # The Vend workflow's commit cannot reach the trigger above: GitHub raises no `push` event for one made with the
  # default `GITHUB_TOKEN`. So it asks for the deploy here instead, and this trigger is as much for that as for a run by
  # hand. There is no schedule, nothing the artifact holds being derived from anything outside the repository.
  workflow_dispatch: {}

permissions:
  contents: 'read'

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: 'Build'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v7'
      - uses: 'pnpm/setup@v3'
        with:
          cache: true
      - run: 'pnpm build'

      - uses: 'actions/upload-pages-artifact@v5'
        with:
          path: 'dist'

  deploy:
    name: 'Deploy'
    needs: 'build'
    runs-on: 'ubuntu-latest'

    permissions:
      id-token: 'write'
      pages: 'write'

    environment:
      name: 'github-pages'
      url: '${{ steps.deploy.outputs.page_url }}'

    steps:
      - id: 'deploy'
        uses: 'actions/deploy-pages@v5'
