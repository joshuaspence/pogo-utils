---
name: 'Prune'

on:
  push:
    branches: ['master']
    paths:
      - '.github/workflows/prune.yml'
      - 'scripts/prune-events.mts'
      - 'src/event-feed.ts'
      - 'src/gpx-source.mts'

  schedule:
    - cron: '10 0 * * *'

  workflow_dispatch: {}

permissions:
  actions: 'write'
  contents: 'write'

# Shared with `vend.yml`: both push to `master` without pulling first, so the second of two at once is rejected.
concurrency:
  group: 'master'
  cancel-in-progress: false

jobs:
  events:
    name: 'Events'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v7'
      - uses: 'pnpm/setup@v3'
        with:
          cache: true
      - run: 'pnpm prune:events'

      # `pnpm build` runs this too, so a commit that fails it fails every later deploy rather than this run. Here it
      # still has somewhere to fail: the commit below never happens.
      - name: 'Check what was pruned'
        run: 'pnpm lint:xml'

      - name: 'Commit'
        id: 'commit'
        uses: 'stefanzweifel/git-auto-commit-action@v7'
        with:
          commit_author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          commit_message: 'Remove ended events'

          # A git pathspec, not a path: `*.gpx` matches at any depth, so this covers whatever `git ls-files` hands the
          # script without widening to every dirty file in the tree.
          file_pattern: 'data/events.json *.gpx'

      # As in `vend.yml`: a commit made with the default `GITHUB_TOKEN` raises no `push` event, so `pages.yml` would not
      # fire on its own.
      - name: 'Deploy'
        if: "steps.commit.outputs.changes_detected == 'true'"
        run: 'gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"'
        env:
          GH_TOKEN: '${{ github.token }}'
