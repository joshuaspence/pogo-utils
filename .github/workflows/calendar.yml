---
name: 'Calendar'

on:
  # Roughly the refresh interval the feed itself advertises. A calendar app polls on its own schedule — Google's is
  # usually slower than this — so there is nothing to gain from rebuilding more often.
  schedule:
    - cron: '20 */6 * * *'
  push:
    branches: ['master']
    # Everything `pnpm build:ics` reads, the script and the modules it imports included — `package.json` because it is
    # where that script is spelled, `src/generated.ts` because it names the index the script opens, and
    # `src/event-feed.ts` because it decides whether a DATE-TIME is floating or UTC and writes the route summary into
    # every VEVENT. Nothing checks this list, so a missed input is a rebuild that waits for the next cron tick.
    paths:
      - '.github/workflows/calendar.yml'
      - 'data/events.json'
      - 'data/entries-by-event.json'
      - 'package.json'
      - 'scripts/build-ics.mts'
      - 'src/event-feed.ts'
      - 'src/generated.ts'
      - 'src/recurring-types.ts'
  workflow_dispatch: {}

permissions:
  actions: 'write'
  contents: 'write'

# Never two at once, and never cancelled part-way: a cancelled run is one that may have written the file and not pushed
# it.
concurrency:
  group: 'calendar'
  cancel-in-progress: false

jobs:
  build:
    name: 'Rebuild the feed'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v7'
      - uses: 'pnpm/setup@v2'
        with:
          cache: true

      # Through pnpm rather than as a bare `node`, because the generator is `.mts` and only what pnpm invokes is
      # governed by the `devEngines` Node floor that guarantees type stripping.
      - run: 'pnpm build:ics'

      # Commits and pushes only when the feed actually differs, which is the whole point of the generator reading no
      # clock: an unchanged file means the event data has not moved, and the run passes without a commit rather than
      # landing fresh timestamps every six hours. `file_pattern` is both what gets added and what that check looks at,
      # so naming the one file the generator writes means nothing else in the tree can ride along. Authored as the bot
      # as well as committed by it, because on a scheduled run the actor the action would otherwise credit is whoever
      # last touched the repository.
      - name: 'Commit'
        id: 'commit'
        uses: 'stefanzweifel/git-auto-commit-action@v7'
        with:
          commit_author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          commit_message: 'Rebuild the calendar feed'
          file_pattern: 'events.ics'

      # Committing the file is not publishing it: Pages serves the `events.ics` that `scripts/assemble.mts` copied into
      # `dist/`, and GitHub raises no `push` event for a commit pushed with the default `GITHUB_TOKEN`, so `pages.yml`
      # never fires for the commit above and the subscribed feed stays at whatever a human push last built.
      # `workflow_dispatch` is the documented exception to that rule, so ask for the deploy rather than waiting for a
      # trigger that cannot arrive. The ref is the branch the commit just landed on, which is what the action pushed to.
      - name: 'Deploy'
        if: "steps.commit.outputs.changes_detected == 'true'"
        run: 'gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"'
        env:
          GH_TOKEN: '${{ github.token }}'
