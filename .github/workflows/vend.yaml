---
name: 'Vend'

on:
  push:
    branches: ['master']
    paths:
      - '.github/workflows/vend.yaml'
      - 'scripts/vend-feed.mts'
      - 'scripts/vend-pgsharp.mts'
      - 'src/event-feed.ts'
      - 'src/pgsharp/release.ts'

  schedule:
    - cron: '40 * * * *'

  workflow_dispatch: {}

# Nothing here uses the default `GITHUB_TOKEN`: the app's installation token does the clone and the push, and no
# other step calls the API.
permissions: {}

# Shared with `prune.yaml`: both push to `master` without pulling first, so the second of two at once is rejected.
concurrency:
  group: 'master'
  cancel-in-progress: false

jobs:
  events:
    name: 'Events'
    runs-on: 'ubuntu-latest'
    steps:
      # A commit pushed with the default `GITHUB_TOKEN` raises no `push` event, which is why this used to dispatch
      # `pages.yaml` by hand. An app's installation token does raise one, so the deploy follows from the push.
      - name: 'Mint an installation token'
        id: 'token'
        uses: 'actions/create-github-app-token@v3.2.0'
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'

      - uses: 'actions/checkout@v7'
        with:
          # `git-auto-commit-action` pushes with whatever credentials `checkout` persisted, so this is what makes the
          # commit the app's rather than the default token's.
          token: '${{ steps.token.outputs.token }}'

      - uses: 'pnpm/setup@v3'
        with:
          cache: true
      - run: 'pnpm vend:events'

      # Derived from the token rather than written down, so it cannot disagree with whichever app minted it. The
      # `<id>+<login>@users.noreply.github.com` form is what links a commit to the account that made it.
      - name: 'Name the committer after the app'
        id: 'committer'
        env:
          GH_TOKEN: '${{ steps.token.outputs.token }}'
          SLUG: '${{ steps.token.outputs.app-slug }}'
        run: |
          id="$(gh api "/users/${SLUG}%5Bbot%5D" --jq '.id')"
          echo "author=${SLUG}[bot] <${id}+${SLUG}[bot]@users.noreply.github.com>" >> "${GITHUB_OUTPUT}"

      - name: 'Commit'
        id: 'commit'
        uses: 'stefanzweifel/git-auto-commit-action@v7'
        with:
          commit_author: '${{ steps.committer.outputs.author }}'
          commit_message: 'Update the Leek Duck feed'
          file_pattern: 'data/events-feed.json'

  # The PGSharp release the Integrations page names on its download button. After `events` rather than beside it,
  # since both push to `master` without pulling and the second would be rejected; and run whether or not `events`
  # failed, since neither reads the other's file.
  pgsharp:
    name: 'PGSharp'
    needs: 'events'
    if: '${{ !cancelled() }}'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Mint an installation token'
        id: 'token'
        uses: 'actions/create-github-app-token@v3.2.0'
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'

      - uses: 'actions/checkout@v7'
        with:
          token: '${{ steps.token.outputs.token }}'

      - uses: 'pnpm/setup@v3'
        with:
          cache: true
      - run: 'pnpm vend:pgsharp'

      - name: 'Name the committer after the app'
        id: 'committer'
        env:
          GH_TOKEN: '${{ steps.token.outputs.token }}'
          SLUG: '${{ steps.token.outputs.app-slug }}'
        run: |
          id="$(gh api "/users/${SLUG}%5Bbot%5D" --jq '.id')"
          echo "author=${SLUG}[bot] <${id}+${SLUG}[bot]@users.noreply.github.com>" >> "${GITHUB_OUTPUT}"

      - name: 'Commit'
        uses: 'stefanzweifel/git-auto-commit-action@v7'
        with:
          commit_author: '${{ steps.committer.outputs.author }}'
          commit_message: 'Update the PGSharp release'
          file_pattern: 'data/pgsharp-release.json'
