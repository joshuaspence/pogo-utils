---
name: 'Test'

on:
  pull_request: {}
  push:
    branches: ['master']

permissions:
  contents: 'read'

jobs:
  all:
    name: 'Unit Test'
    needs: 'test'
    if: 'always()'
    runs-on: 'ubuntu-latest'
    steps:
      - if: "needs.test.result != 'success'"
        run: 'exit 1'

  test:
    name: '${{ matrix.project }}'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project:
          - 'corpus'
          - 'default'
    steps:
      - uses: 'actions/checkout@v7'
        with:
          lfs: true

      # Cached rather than installed from the runner's Ubuntu mirror on every run, which four times in a day hung a job
      # on `apt-get` until its 30 minutes were up. The install scripts run on a restore, since ffmpeg reaches
      # `libblas.so.3` through a link one of them makes: restored without them, it would not start.
      - name: 'Install dependencies'
        uses: 'awalsh128/cache-apt-pkgs-action@v1'
        with:
          packages: 'ffmpeg tesseract-ocr tesseract-ocr-eng'
          execute_install_scripts: true

      - uses: 'pnpm/setup@v3'
        with:
          cache: true
      - run: 'pnpm test:${{ matrix.project }}'
