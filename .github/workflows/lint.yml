---
name: 'Lint'

on:
  pull_request: {}
  push:
    branches: ['master']

permissions:
  contents: 'read'

jobs:
  lint:
    name: '${{ matrix.check }}'
    runs-on: 'ubuntu-latest'
    strategy:
      fail-fast: false
      matrix:
        check:
          - 'css'
          - 'html'
          - 'js'
          - 'prettier'
          - 'types'
          - 'xml'
    steps:
      - uses: 'actions/checkout@v7'
      - uses: 'pnpm/setup@v2'
        with:
          cache: true
      - run: 'pnpm lint:${{ matrix.check }}'

  # The one check `master`'s protection rule requires, so the matrix stays the only place the legs are named.
  # `always()` is load-bearing: a required check that is skipped counts as passed.
  complete:
    name: 'Complete'
    needs: 'lint'
    if: 'always()'
    runs-on: 'ubuntu-latest'
    steps:
      - if: "needs.lint.result != 'success'"
        run: 'exit 1'
