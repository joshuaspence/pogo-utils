---
name: 'Lint'

on:
  pull_request: {}
  push:
    branches: ['master']

permissions:
  contents: 'read'

jobs:
  lint:
    name: '${{ matrix.check }}'
    runs-on: 'ubuntu-latest'
    strategy:
      fail-fast: false
      matrix:
        check:
          - 'css'
          - 'html'
          - 'js'
          - 'prettier'
          - 'types'
          - 'xml'
    steps:
      - uses: 'actions/checkout@v7'
      - uses: 'pnpm/setup@v2'
        with:
          cache: true
      - run: 'pnpm lint:${{ matrix.check }}'
