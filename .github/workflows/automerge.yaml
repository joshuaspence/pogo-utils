---
name: 'Automerge'

on:
  pull_request: {}

permissions:
  contents: 'write'
  pull-requests: 'write'

jobs:
  dependabot:
    name: 'Dependabot'
    if: "github.event.pull_request.user.login == 'dependabot[bot]'"
    runs-on: 'ubuntu-latest'
    steps:
      - run: 'gh pr merge --auto --squash "${PR_URL}"'
        env:
          GH_TOKEN: '${{ github.token }}'
          PR_URL: '${{ github.event.pull_request.html_url }}'
