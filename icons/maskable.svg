<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <title>Pokémon GO Utilities</title>

  <!--
    The source of icons/maskable-512.png, the home-screen icon Android crops to its own circle or squircle. favicon.svg
    fills its canvas to the edge, and a launcher only promises to keep the central circle of 40% radius, so its rim
    would be cut away. This is the same ball on a 48px canvas instead of a 32px one: its outer edge sits at radius 16,
    inside the 19.2 that survives, on a solid background because the corners of a masked icon are never transparent.
    The background is the light theme's page background and the rim its text colour, fixed rather than following
    prefers-color-scheme, since a launcher paints the icon once rather than per theme.
  -->
  <rect width="48" height="48" fill="#f7f8fa" />

  <g transform="translate(8 8)">
    <defs>
      <clipPath id="ball">
        <circle cx="16" cy="16" r="15" />
      </clipPath>
    </defs>

    <g clip-path="url(#ball)">
      <rect width="32" height="32" fill="#fff" />
      <rect width="32" height="16" fill="#e3350d" />
      <rect y="13" width="32" height="6" fill="#1c1f26" />
    </g>

    <circle cx="16" cy="16" r="15" fill="none" stroke="#1c1f26" stroke-width="2" />
    <circle cx="16" cy="16" r="4.5" fill="#fff" stroke="#1c1f26" stroke-width="2" />
  </g>
</svg>
